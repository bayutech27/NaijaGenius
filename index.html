<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Play Store redirect (once app is approved, flip PLAY_STORE_LIVE to true) -->
    <script>
      const PLAY_STORE_LIVE = false; // ⚠️ SWITCH TO true THE DAY YOUR APP IS APPROVED
      const PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=YOUR_PACKAGE_NAME'; // ⚠️ UPDATE with your real package name
      if (PLAY_STORE_LIVE && /Android/i.test(navigator.userAgent)) {
        window.location.href = PLAY_STORE_URL;
      }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NaijaGenius • Login</title>

    <!-- Open Graph tags (WhatsApp/Facebook link preview) -->
    <meta property="og:title" content="NaijaGenius — Test Your Naija Knowledge" />
    <meta property="og:description" content="Afrobeats, Nollywood, Naija food, Naija culture, football and more. Think you sabi Naija well well? Prove it." />
    <meta property="og:image" content="https://naijagenius.vercel.app/assets/naija-genius-icon.png" />
    <meta property="og:url" content="https://naijagenius.vercel.app" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="glass-card fade-in-up">
            <div class="brand-header">
                <h1 class="logo"><span class="naija">Naija</span><span class="genius">Genius</span></h1>
                <p class="tagline">Welcome back, trivia champion</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="loginEmail" placeholder="Email address" autocomplete="email" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
                    <i class="fas fa-eye-slash toggle-password" data-target="loginPassword"></i>
                </div>

                <button type="submit" id="loginBtn" class="auth-btn">
                    <span>Login</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="divider">or</div>

            <button id="googleBtn" class="auth-btn google-btn">
                <i class="fab fa-google"></i>
                <span>Continue with Google</span>
            </button>

            <div class="auth-links">
                <p>Not registered? <a href="signup.html" class="highlight-link">Signup here</a></p>
                <p>Forgot password? <a href="reset-password.html" class="highlight-link">Reset here</a></p>
            </div>

            <!-- Proudly Naija Footer -->
            <div class="proudly-naija">
                <span class="flag">🇳🇬</span> Proudly <span>Naija</span>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script type="module" src="/js/auth.js"></script>
</body>
</html>
