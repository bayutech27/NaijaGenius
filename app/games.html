<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>NaijaGenius • Game</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇳🇬</text></svg>" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />

    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700;800&family=Orbitron:wght@400;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="/css/games.css" />
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <!-- Back arrow with replace behaviour -->
            <button id="backBtn" class="back-btn" aria-label="Back to Dashboard">
                <i class="fas fa-arrow-left"></i>
            </button>

            <div class="header-timer-wrap">
                <div class="circular-timer" id="timerDisplay">
                    <svg viewBox="0 0 36 36" class="timer-svg">
                        <path class="timer-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <path class="timer-progress" id="timerPath" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    </svg>
                    <div class="timer-center">
                        <span class="timer-seconds" id="timerSeconds">15</span>
                        <span class="timer-unit">SEC</span>
                    </div>
                </div>
            </div>

            <div class="header-actions">
                <span class="game-coins-badge" id="gameCoinsBadge">
                    <i class="fas fa-coins"></i>
                    <span id="gameCoinsValue">0</span>
                </span>
            </div>
        </div>
    </header>

    <main class="game-container">
        <!-- ... existing game UI ... -->
    </main>

    <div id="toastContainer" class="toast-container"></div>

    <script type="module" src="/js/games.js"></script>

    <script>
        (function() {
            // 1. Back arrow: replace the current page with dashboard
            const backBtn = document.getElementById('backBtn');
            if (backBtn) {
                backBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    window.location.replace('/app/dashboard.html');
                });
            }

            // 2. Device back button (popstate) – if we end up back on game, redirect to dashboard with replace
            window.addEventListener('popstate', function(event) {
                if (window.location.pathname.includes('games.html')) {
                    window.location.replace('/app/dashboard.html');
                }
            });

            // 3. pageshow (bfcache) – if the page is restored from cache, redirect
            window.addEventListener('pageshow', function(event) {
                if (event.persisted && window.location.pathname.includes('games.html')) {
                    window.location.replace('/app/dashboard.html');
                }
            });

            // 4. Push a dummy state so popstate fires on back press
            if (history.state === null) {
                history.pushState({ game: true }, document.title, window.location.href);
            } else {
                history.pushState({ game: true }, document.title, window.location.href);
            }
        })();
    </script>
</body>
</html>
